name: Production Release & Testnet Deployment

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Run Contract Tests
        run: cargo test --all

      - name: Build Soroban WASM Artifacts
        run: stellar contract build

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Strict Typecheck & Test Suite
        run: |
          npm run typecheck
          npm test

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org

      - name: Verify Deployment Prerequisites
        run: |
          echo "✅ All contracts and frontend builds verified for deployment."
